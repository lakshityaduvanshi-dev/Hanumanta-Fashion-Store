<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanumanta Admin</title>
<style>
:root{--bg:#f6f2ee;--sf:#fff;--ink:#1b1720;--mut:#7a727f;--line:#e6dfd8;--acc:#8a3156;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#120f15;--sf:#1e1923;--ink:#f3eee8;--mut:#a99fb2;--line:#2f2935;--acc:#e6a6c0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
h1{font-weight:500;margin:0 0 14px}h3{margin:22px 0 8px;font-weight:600}
input,select,textarea,button{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink)}
button{background:var(--ink);color:var(--bg);cursor:pointer;border-color:var(--ink)}button.o{background:none;color:var(--ink);border-color:var(--line)}
.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}.tabs button{background:var(--sf);color:var(--ink);border-color:var(--line)}.tabs button.on{background:var(--ink);color:var(--bg)}
table{border-collapse:collapse;width:100%;background:var(--sf);border-radius:12px;overflow:hidden}td,th{border-bottom:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500;font-size:12px}
.m{color:var(--mut);font-size:12px}.chip{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:#eee;color:#444;white-space:nowrap}.s-out_for_delivery{background:#fff0d6;color:#8a5a00}.s-delivered{background:#dff5e3;color:#1d6b32}.s-cancelled,.s-failed{background:#fde2e2;color:#a52a2a}.s-confirmed,.s-packed{background:#e8ecff;color:#2f3f9a}
.box{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;display:flex;gap:8px;flex-wrap:wrap}.wrap{overflow:auto}.bar2{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}.bar2 input{min-width:240px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{background:var(--sf);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column}.stat b{font-size:1.7rem;font-weight:600}.stat span{color:var(--mut);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.fld{display:flex;flex-direction:column;gap:4px;font-weight:500}.fld input{width:100%}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);padding:20px;max-width:640px;width:calc(100% - 24px)}dialog::backdrop{background:rgba(0,0,0,.5)}
.ph{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.ph div{width:96px;text-align:center}.ph img{width:96px;height:120px;object-fit:cover;border-radius:10px;display:block}.ph button{padding:3px 8px;font-size:11px;margin-top:3px}
</style></head><body>
<h1>Hanumanta Store · Admin</h1>
<div><input id="k" type="password" placeholder="Admin key"> <button id="go">Open</button> <button class="o" id="lo" hidden>Log out</button> <span id="msg" class="m"></span></div>
<div class="tabs" id="tabs" hidden></div><div id="out" class="wrap"></div><dialog id="pd"></dialog>
<script>
const $=s=>document.querySelector(s),H={};let tab="dashboard",partners=[],OR=[],PR=[],CONF={},STORE={},pdPh=[];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api=async(p,m="GET",b)=>{const r=await fetch(p,{method:m,headers:{...H,...(b?{"Content-Type":"application/json"}:{})},body:b?JSON.stringify(b):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||"Error");return d};
const when=d=>new Date(d).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const NEXT={new:["confirmed","cancelled"],confirmed:["packed","cancelled"],packed:["out_for_delivery","cancelled"],out_for_delivery:["delivered","cancelled","failed"]};
const flash=t=>{$("#msg").textContent=t;setTimeout(()=>$("#msg").textContent="",2000)};
$("#k").value=sessionStorage.getItem("ak")||"";
async function open_(){H["x-admin-key"]=$("#k").value;try{partners=(await api("/api/admin/partners")).partners;CONF=await fetch("/api/config").then(r=>r.json());STORE=CONF.store||{};sessionStorage.setItem("ak",$("#k").value);$("#msg").textContent="";$("#tabs").hidden=false;$("#lo").hidden=false;show(tab)}catch(e){$("#msg").textContent=e.message}}
function show(t){tab=t;$("#tabs").innerHTML=[["dashboard","Dashboard"],["orders","Orders"],["returns","Returns & refunds"],["products","Products & stock"],["cash","Cash from partners"],["partners","Delivery partners"],["customers","Customers"],["settings","Settings"],["subs","Newsletter"]].map(([k,l])=>`<button class="${k===t?"on":""}" onclick="show('${k}')">${l}</button>`).join("");({dashboard:dash,orders,returns:rets,products:prods,cash,partners:pt,customers,settings:sett,subs})[t]().catch(e=>flash(e.message))}
// ---------- dashboard ----------
async function dash(){const s=await api("/api/admin/summary"),c=(n,l,g)=>`<button class="stat" onclick="show('${g}')"><b>${n}</b><span>${l}</span></button>`;
 $("#out").innerHTML=`<div class="stats">${c(s.newOrders,"New orders to confirm","orders")}${c(s.toPack,"Confirmed, to pack","orders")}${c(s.ready,"Packed, ready for delivery","orders")}${c(s.outForDelivery,"Out for delivery","orders")}${c(s.todayOrders,"Orders today","orders")}${c("₹"+s.todaySales,"Sales today","orders")}${c(s.returnsOpen,"Open returns","returns")}${c("₹"+s.cashPending,"Cash with delivery partners","cash")}</div>
 <h3>Low stock (5 or fewer)</h3>${s.lowStock.length?`<table><tr><th>Kurti</th><th>Left</th></tr>${s.lowStock.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stock}</td></tr>`).join("")}</table>`:'<div class="m">Nothing is running low.</div>'}`}
// ---------- orders ----------
async function orders(){partners=(await api("/api/admin/partners")).partners;OR=(await api("/api/admin/orders")).orders;const n=OR.filter(o=>["confirmed","packed"].includes(o.status)).length;
 $("#out").innerHTML=`<div class="bar2"><input id="oq" placeholder="Search order number, name or mobile" oninput="paint()"><select id="os" onchange="paint()"><option value="">All statuses</option>${["new","confirmed","packed","out_for_delivery","delivered","cancelled","failed"].map(s=>`<option>${s}</option>`).join("")}</select><button class="o" onclick="csv()">Download CSV</button><button class="o" onclick="slips()">Print packing slips (${n})</button></div><div id="otab"></div>`;paint()}
const waLink=o=>{const w=o.customer.phone.replace(/\D/g,"").slice(-10),nm=STORE.name||"the store",t={new:`we received your order ${o.orderId} (₹${o.total}, cash on delivery). We will confirm it shortly.`,confirmed:`your order ${o.orderId} is confirmed and we are packing it.`,packed:`your order ${o.orderId} is packed and will go out for delivery soon.`,out_for_delivery:`your order ${o.orderId} is out for delivery${o.partner?" with "+o.partner.name+" ("+o.partner.phone+")":""}. Please keep ₹${o.total} ready.`,delivered:`your order ${o.orderId} was delivered. Thank you!`,cancelled:`your order ${o.orderId} was cancelled.`,failed:`we could not deliver your order ${o.orderId}. Please contact us.`}[o.status];return `https://wa.me/91${w}?text=${encodeURIComponent("Hello "+o.customer.name+", "+t+" - "+nm)}`};
function paint(){const q=($("#oq").value||"").toLowerCase(),st=$("#os").value,act=partners.filter(p=>p.active);
 const list=OR.filter(o=>(!st||o.status===st)&&(!q||(o.orderId+o.customer.name+o.customer.phone).toLowerCase().includes(q)));
 $("#otab").innerHTML=`<table><tr><th>Order</th><th>Customer & address</th><th>Items</th><th>Total</th><th>Status</th><th>Delivery partner</th></tr>${list.map(o=>{const c=o.customer,n=NEXT[o.status]||[],closed=!n.length;
 return `<tr><td><b>${o.orderId}</b><div class="m">${when(o.createdAt)}</div><div class="m"><a target="_blank" href="/bill.html?admin=1&id=${o.orderId}">Bill</a> · <a target="_blank" href="/bill.html?id=${o.orderId}&type=slip">Packing slip</a> · <a target="_blank" rel="noopener" href="${waLink(o)}">WhatsApp</a></div></td>
 <td>${esc(c.name)}<br>${esc(c.phone)}<div class="m">${esc(c.address)}, ${esc(c.city)} ${esc(c.pin)}${c.lat!=null?` · <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${c.lat},${c.lng}">map pin</a>`:""}</div></td>
 <td>${o.items.map(i=>`${esc(i.name)} (${esc(i.size)}) × ${i.qty}`).join("<br>")}</td><td>₹${o.total}<div class="m">${esc(o.payment)}${o.coupon?" · "+esc(o.coupon):""}</div></td>
 <td><span class="chip s-${o.status}">${o.status.replace(/_/g," ")}</span>${closed?"":`<br><select onchange="st('${o.orderId}',this.value)"><option value="">Move to…</option>${n.map(s=>`<option value="${s}">${s==="failed"?"not delivered":s.replace(/_/g," ")}</option>`).join("")}</select>`}</td>
 <td>${closed&&!o.partner?"-":`<select onchange="as('${o.orderId}',this.value)" ${closed?"disabled":""}><option value="">Not assigned</option>${act.map(p=>`<option value="${p.id}" ${o.partner&&o.partner.id===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}${o.partner&&!act.some(p=>p.id===o.partner.id)?`<option value="${o.partner.id}" selected>${esc(o.partner.name)}</option>`:""}</select>`}${o.partner&&o.partner.location?`<div class="m"><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${o.partner.location.lat},${o.partner.location.lng}">Live location</a></div>`:""}</td></tr>`}).join("")||'<tr><td colspan="6" class="m">No orders.</td></tr>'}</table>`}
function failReason(){const r=CONF.failReasons||[];const n=prompt("Why was it not delivered?\n"+r.map((x,i)=>(i+1)+") "+x).join("\n")+"\n\nType the number:");return n&&r[+n-1]}
async function st(id,s){if(!s)return;try{const b={status:s};if(s==="failed"){b.reason=failReason();if(!b.reason){paint();return}}await api("/api/admin/orders/"+id,"PATCH",b);orders()}catch(e){alert(e.message);orders()}}
async function as(id,v){try{await api("/api/admin/orders/"+id,"PATCH",{partnerId:v?Number(v):null});orders()}catch(e){alert(e.message);orders()}}
function slips(){const ids=OR.filter(o=>["confirmed","packed"].includes(o.status)).map(o=>o.orderId);if(!ids.length)return alert("No confirmed or packed orders to print.");window.open("/bill.html?type=slip&ids="+ids.join(","),"_blank")}
function csv(){const q=v=>{let s=String(v==null?"":v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const rows=[["Order","Date","Status","Customer","Mobile","Address","City","PIN","Items","Total","Payment","Delivery partner"]].concat(OR.map(o=>[o.orderId,o.createdAt,o.status,o.customer.name,o.customer.phone,o.customer.address,o.customer.city,o.customer.pin,o.items.map(i=>`${i.name} (${i.size}) x ${i.qty}`).join("; "),o.total,o.payment,o.partner?o.partner.name:""]));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download="orders-"+new Date().toISOString().slice(0,10)+".csv";a.click()}
// ---------- returns ----------
async function rets(){const {returns:rs}=await api("/api/admin/returns");
 const chip={requested:"s-new",approved:"s-confirmed",received:"s-packed",refunded:"s-delivered",rejected:"s-cancelled"};
 $("#out").innerHTML=`<div class="m" style="margin:0 0 8px">Customers request returns from their order page. Approve it, collect the item, then send the refund to their UPI ID and mark it refunded with the payment reference.</div><table><tr><th>Order</th><th>Customer</th><th>Items and reason</th><th>Refund to</th><th>Amount</th><th>Status</th></tr>${rs.map(r=>{const acts={requested:[["approved","Approve"],["rejected","Reject"]],approved:[["received","Mark item received"],["refunded","Refund without pickup"],["rejected","Reject"]],received:[["refunded","Mark refunded"]]}[r.status]||[];
 return `<tr><td><b>${esc(r.orderId)}</b><div class="m">${when(r.createdAt)}</div></td><td>${esc(r.customer.name)}<br>${esc(r.customer.phone)}</td>
 <td>${r.items.map(i=>`${esc(i.name)} (${esc(i.size)}) × ${i.qty}`).join("<br>")}<div class="m">${esc(r.reason)}${r.comment?": "+esc(r.comment):""}${r.photo?` · <a target="_blank" rel="noopener" href="${esc(r.photo)}">photo</a>`:""}</div></td>
 <td>${esc(r.refundTo)}</td><td>₹${r.amount}</td><td><span class="chip ${chip[r.status]}">${r.status}</span>${r.adminNote?`<div class="m">${esc(r.adminNote)}</div>`:""}<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${acts.map(([s,l])=>`<button class="o" onclick="ra(${r.id},'${s}',${r.amount})">${l}</button>`).join("")}</div></td></tr>`}).join("")||'<tr><td colspan="6" class="m">No return requests yet.</td></tr>'}</table>`}
async function ra(id,status,amount){const b={status};let note="";
 if(status==="approved"){note=prompt("Note for the customer (for example how the pickup will happen)","Our delivery partner will contact you to collect the item.");if(note===null)return}
 if(status==="rejected"){note=prompt("Why is this return rejected? The customer will see this.");if(!note)return}
 if(status==="received"){note=prompt("Note (optional)","Item received and checked");if(note===null)return;b.restock=confirm("Put the returned items back in stock?\n\nPress OK only if they can be sold again.")}
 if(status==="refunded"){const a=prompt("Refund amount in rupees",amount);if(a===null)return;b.amount=Number(a);note=prompt("Payment reference, for example the UPI transaction id (the customer will see this)");if(!note)return}
 b.note=note;try{await api("/api/admin/returns/"+id,"PATCH",b);rets()}catch(e){alert(e.message)}}
// ---------- products ----------
const shrink=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82))};i.onerror=()=>no(new Error("Could not read that photo."));i.src=URL.createObjectURL(f)});
async function prods(){const d=await api("/api/admin/products"),ps=d.products,cats=d.cats;PR=ps;
 $("#out").innerHTML=`<form class="box" id="np"><b style="width:100%">Add a new kurti</b><input type="file" id="pf" accept="image/jpeg,image/png,image/webp" required><input name="name" placeholder="Name" required style="min-width:220px"><select name="cat">${cats.map(c=>`<option>${c}</option>`).join("")}</select><input name="price" type="number" min="1" placeholder="Price ₹" style="width:110px" required><input name="stock" type="number" min="0" placeholder="Stock" style="width:90px" required><button>Add kurti</button><span class="m" id="ne"></span></form>
 <div class="m" style="margin:0 0 8px">Stock 0 shows "Sold out". Untick Visible to hide a kurti. Press Save on the row after changing it. Use <b>Details</b> for the description, fabric and care, and more photos.</div>
 <table><tr><th></th><th>Name</th><th>Colour</th><th>Price ₹</th><th>Stock</th><th>Visible</th><th></th></tr>${ps.map(p=>`<tr><td><img src="${esc(p.img)}" width="44" height="56" style="object-fit:cover;border-radius:8px" alt=""></td><td><input id="n${p.id}" value="${esc(p.name)}" style="width:100%;min-width:190px"></td><td><select id="c${p.id}">${cats.map(c=>`<option ${c===p.cat?"selected":""}>${c}</option>`).join("")}</select></td><td><input id="p${p.id}" type="number" min="1" value="${p.price}" style="width:90px"></td><td><input id="s${p.id}" type="number" min="0" value="${p.stock}" style="width:80px"></td><td><input type="checkbox" id="a${p.id}" ${p.active?"checked":""}></td><td><button onclick="sp(${p.id})">Save</button> <button class="o" onclick="editP(${p.id})">Details${p.description||p.photos.length?" ✓":""}</button></td></tr>`).join("")}</table>`;
 $("#np").onsubmit=async e=>{e.preventDefault();const f=e.target;$("#ne").textContent="Uploading…";try{const {url}=await api("/api/admin/images","POST",{data:await shrink($("#pf").files[0])});await api("/api/admin/products","POST",{name:f.name.value,cat:f.cat.value,price:f.price.value,stock:f.stock.value,img:url});prods()}catch(er){$("#ne").textContent=er.message}}}
async function sp(id){try{await api("/api/admin/products/"+id,"PATCH",{name:$("#n"+id).value,cat:$("#c"+id).value,price:$("#p"+id).value,stock:$("#s"+id).value,active:$("#a"+id).checked});flash("Saved")}catch(e){alert(e.message)}}
let pdP=null;
function editP(id){pdP=PR.find(x=>x.id===id);pdPh=[pdP.img,...pdP.photos];drawPd()}
function keepText(){if($("#pdd")){pdP.description=$("#pdd").value;pdP.details=$("#pdc").value}}
function drawPd(){const p=pdP;$("#pd").innerHTML=`<h3 style="margin-top:0">${esc(p.name)}</h3><label class="fld">Description (shown to customers)<textarea id="pdd" rows="4" maxlength="1500" placeholder="For example: A short flared kurti with a V-neck, full sleeves and gathered waist.">${esc(p.description)}</textarea></label>
 <label class="fld" style="margin-top:10px">Fabric and care<textarea id="pdc" rows="3" maxlength="600" placeholder="For example: 100% cotton. Machine wash cold. Do not bleach.">${esc(p.details)}</textarea></label>
 <h3>Photos (the first one is the main photo)</h3><div class="ph">${pdPh.map((u,i)=>`<div><img src="${esc(u)}" alt=""><button class="o" ${i===0?"disabled":""} onclick="pdMain(${i})">Make main</button><button class="o" ${pdPh.length<2?"disabled":""} onclick="pdDel(${i})">Remove</button></div>`).join("")}</div>
 <input type="file" id="pdf" accept="image/jpeg,image/png,image/webp" ${pdPh.length>=7?"disabled":""}> <span class="m" id="pdm">Up to 7 photos.</span>
 <div style="margin-top:16px;display:flex;gap:8px"><button onclick="pdSave()">Save</button><button class="o" onclick="$('#pd').close()">Cancel</button></div>`;
 $("#pdf").onchange=async e=>{if(!e.target.files[0])return;$("#pdm").textContent="Uploading…";keepText();try{pdPh.push((await api("/api/admin/images","POST",{data:await shrink(e.target.files[0])})).url);drawPd()}catch(er){$("#pdm").textContent=er.message}};
 if(!$("#pd").open)$("#pd").showModal()}
function pdMain(i){keepText();const [u]=pdPh.splice(i,1);pdPh.unshift(u);drawPd()}
function pdDel(i){keepText();pdPh.splice(i,1);drawPd()}
async function pdSave(){keepText();try{await api("/api/admin/products/"+pdP.id,"PATCH",{description:pdP.description,details:pdP.details,img:pdPh[0],photos:pdPh.slice(1)});$("#pd").close();prods()}catch(e){$("#pdm").textContent=e.message}}
// ---------- cash from delivery partners ----------
async function cash(){const d=await api("/api/admin/cash");
 $("#out").innerHTML=`<div class="m" style="margin:0 0 8px">Delivery partners collect cash from customers. When a partner gives you the cash, tick those orders and press "Cash received".</div>${d.partners.map(p=>`<div class="box" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.name)} · ${esc(p.phone)}</b><b>₹${p.pending} with the partner</b></div>${p.orders.length?`<table style="margin:8px 0"><tr><th></th><th>Order</th><th>Customer</th><th>Cash</th></tr>${p.orders.map(o=>`<tr><td><input type="checkbox" class="ck${p.id}" value="${o.orderId}" checked></td><td>${o.orderId}</td><td>${esc(o.customer)}</td><td>₹${o.total}</td></tr>`).join("")}</table><button onclick="settle(${p.id})">Cash received for the ticked orders</button>`:'<div class="m">No cash pending.</div>'}</div>`).join("")||'<div class="m">Add a delivery partner first.</div>'}
 <h3>Recent handovers</h3><table><tr><th>Date</th><th>Partner</th><th>Amount</th><th>Note</th></tr>${d.recent.map(s=>`<tr><td>${when(s.createdAt)}</td><td>${esc((d.partners.find(p=>p.id===s.partnerId)||{}).name||"")}</td><td>₹${s.amount}</td><td>${esc(s.note)}</td></tr>`).join("")||'<tr><td colspan="4" class="m">Nothing yet.</td></tr>'}</table>`}
async function settle(pid){const ids=[...document.querySelectorAll(".ck"+pid+":checked")].map(c=>c.value);if(!ids.length)return alert("Tick the orders you received cash for.");const note=prompt("Note (optional)","");if(note===null)return;try{const r=await api("/api/admin/cash/settle","POST",{partnerId:pid,orderIds:ids,note});flash("Recorded ₹"+r.amount);cash()}catch(e){alert(e.message)}}
// ---------- delivery partners, customers, newsletter ----------
async function pt(){partners=(await api("/api/admin/partners")).partners;
 $("#out").innerHTML=`<form class="box" id="pf2"><input name="name" placeholder="Partner name" required><input name="phone" placeholder="Mobile (login)" maxlength="10" required><input name="password" placeholder="Password (6+)" required><input name="vehicle" placeholder="Vehicle (optional)"><button>Add partner</button><span class="m" id="pe"></span></form>
 <table><tr><th>Name</th><th>Mobile</th><th>Vehicle</th><th>Delivered</th><th>Status</th></tr>${partners.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.phone)}</td><td>${esc(p.vehicle)}</td><td>${p.delivered}</td><td>${p.active?"Active":"Disabled"} <button class="o" onclick="tg(${p.id},${!p.active})">${p.active?"Disable":"Enable"}</button> <button class="o" onclick="rc(${p.id})">Reset code</button>${p.resetRequestedAt?' <span class="chip s-out_for_delivery">Reset requested</span>':""}</td></tr>`).join("")||'<tr><td colspan="5" class="m">No delivery partners yet. Add one above; they log in at /delivery.html.</td></tr>'}</table>`;
 $("#pf2").onsubmit=async e=>{e.preventDefault();const f=e.target;try{await api("/api/admin/partners","POST",{name:f.name.value,phone:f.phone.value,password:f.password.value,vehicle:f.vehicle.value});pt()}catch(er){$("#pe").textContent=er.message}}}
async function rc(id){try{const d=await api("/api/admin/users/"+id+"/reset-code","POST",{});prompt("Reset code for "+d.name+" ("+d.phone+"). Valid for "+d.minutes+" minutes. Tell this code to them by phone or WhatsApp.",d.code);show(tab)}catch(e){alert(e.message)}}
async function tg(id,a){await api("/api/admin/partners/"+id,"PATCH",{active:a});pt()}
async function customers(){const {customers:cs}=await api("/api/admin/customers");$("#out").innerHTML=`<div class="m" style="margin:0 0 8px">A customer is blocked automatically after refusing deliveries (see Settings). Blocked customers cannot log in or order. Unblock them here.</div><table><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Orders</th><th>Refused deliveries</th><th>Joined</th><th>Account</th></tr>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${c.orders}</td><td>${c.refusedCount||0}</td><td>${when(c.createdAt)}</td><td>${c.active?"":'<span class="chip s-cancelled">Blocked</span> '}<button class="o" onclick="blk(${c.id},${!c.active})">${c.active?"Block":"Unblock"}</button> <button class="o" onclick="rc(${c.id})">Reset code</button>${c.resetRequestedAt?' <span class="chip s-out_for_delivery">Reset requested</span>':""}</td></tr>`).join("")||'<tr><td colspan="7" class="m">No customers yet.</td></tr>'}</table>`}
async function blk(id,a){if(!a&&!confirm("Block this customer? They will not be able to log in or order."))return;try{await api("/api/admin/customers/"+id,"PATCH",{active:a});customers()}catch(e){alert(e.message)}}
async function subs(){const {subscribers:s}=await api("/api/admin/subscribers");$("#out").innerHTML=`<table><tr><th>Email</th><th>Joined</th></tr>${s.map(x=>`<tr><td>${esc(x.email)}</td><td>${when(x.createdAt)}</td></tr>`).join("")||'<tr><td colspan="2" class="m">No subscribers yet.</td></tr>'}</table>`}
// ---------- settings ----------
const cpRow=c=>`<tr><td><input class="cc" value="${esc(c.code)}" style="width:130px"></td><td><input class="cp" type="number" value="${c.percent}" style="width:80px"></td><td><input class="cm" type="number" value="${c.minOrder||0}" style="width:100px"></td><td><input class="ca" type="checkbox" ${c.active!==false?"checked":""}></td><td><button class="o" onclick="this.closest('tr').remove()">Remove</button></td></tr>`;
function addCp(){$("#cpt").insertAdjacentHTML("beforeend",cpRow({code:"",percent:10,minOrder:0,active:true}))}
async function sett(){const {settings:s}=await api("/api/admin/settings"),n=(k,l,h)=>`<label class="fld">${l}<input type="number" id="s_${k}" value="${s[k]}"><span class="m">${h||""}</span></label>`,t=(k,l,v,ph)=>`<label class="fld">${l}<input id="s_${k}" value="${esc(v)}" placeholder="${esc(ph||"")}"></label>`;
 $("#out").innerHTML=`<div class="box" style="display:block"><h3 style="margin-top:0">Shipping and returns</h3><div class="grid2">${n("freeShippingMin","Free shipping from (₹)","Orders at or above this get free shipping")}${n("shippingFee","Shipping fee below that (₹)")}${n("returnDays","Return period (days)","Counted from the delivery")}</div>
 <h3>Protection against fake cash-on-delivery orders</h3><div class="grid2">${n("maxOpenOrders","Orders on the way per customer","No new order until these are delivered")}${n("ordersPerDay","Orders per customer per day")}${n("maxItemsPerOrder","Items in one order")}${n("maxOrderValue","Highest order value (₹)")}${n("autoBlockAfter","Block after this many refused deliveries","0 means never block automatically")}</div>
 <h3>Delivery area</h3>${t("pins","PIN codes we deliver to (separate with commas)",s.deliveryPins.join(", "),"302, 303   (empty = deliver everywhere)")}
 <h3>Coupons</h3><table id="cpt"><tr><th>Code</th><th>Percent off</th><th>Minimum order ₹</th><th>Active</th><th></th></tr>${s.coupons.map(cpRow).join("")}</table><div style="margin-top:8px"><button class="o" onclick="addCp()">Add a coupon</button></div>
 <h3>Banner at the top of the shop</h3>${t("banner","Short message (empty = no banner)",s.banner,"Diwali sale: free shipping on all orders")}
 <h3>Size guide</h3><label class="fld">One size per line: size, bust, waist, length<textarea id="s_size" rows="6" placeholder="M, 36 in, 32 in, 28 in">${esc(s.sizeChart.map(r=>[r.size,r.bust,r.waist,r.length].join(", ")).join("\n"))}</textarea></label><div class="m">Leave empty to hide the size guide. Write the numbers from your own measuring.</div>
 <h3>Shop details (shown on bills and the policies page)</h3><div class="grid2">${t("sname","Shop name",s.store.name)}${t("sphone","Phone / WhatsApp (10 digits)",s.store.phone)}${t("semail","Email",s.store.email)}${t("saddr","Address",s.store.address)}${t("sgst","GSTIN (if you have one)",s.store.gstin)}</div>
 <div style="margin-top:16px"><button onclick="saveS()">Save settings</button> <span class="m" id="sm"></span></div></div>`}
async function saveS(){const v=id=>$("#"+id).value,b={};for(const k of ["freeShippingMin","shippingFee","returnDays","maxOpenOrders","ordersPerDay","maxItemsPerOrder","maxOrderValue","autoBlockAfter"])b[k]=v("s_"+k);
 b.deliveryPins=v("s_pins");b.banner=v("s_banner");b.coupons=[...document.querySelectorAll("#cpt tr")].slice(1).map(r=>({code:r.querySelector(".cc").value,percent:r.querySelector(".cp").value,minOrder:r.querySelector(".cm").value,active:r.querySelector(".ca").checked}));
 b.sizeChart=v("s_size").split("\n").map(l=>l.split(",").map(x=>x.trim())).filter(r=>r[0]).map(r=>({size:r[0],bust:r[1]||"",waist:r[2]||"",length:r[3]||""}));
 b.store={name:v("s_sname"),phone:v("s_sphone"),email:v("s_semail"),address:v("s_saddr"),gstin:v("s_sgst")};
 try{const d=await api("/api/admin/settings","PUT",b);STORE=d.settings.store;CONF=await fetch("/api/config").then(r=>r.json());$("#sm").textContent="Saved. The shop uses these now."}catch(e){$("#sm").textContent=e.message}}
$("#go").onclick=open_;$("#k").onkeydown=e=>{if(e.key==="Enter")open_()};$("#lo").onclick=()=>{sessionStorage.removeItem("ak");location.reload()};
</script></body></html>
